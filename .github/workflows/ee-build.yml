name: AWX EE development image build
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ee-build.yml'
      - 'execution-environment.yml'
      - 'requirements.txt'
      - 'Dockerfile.receptor'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible Builder
        run: python3 -m pip install --user ansible-builder
      - name: Rebuild patched Receptor without publishing
        run: |
          docker build --file Dockerfile.receptor --tag awx-ee-receptor-patched:ci .
          docker run --rm --entrypoint /out/receptor awx-ee-receptor-patched:ci --version
      - name: Build execution environment without publishing
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ansible-builder build -f execution-environment.yml -t awx-ee-dev:ci --container-runtime docker
      - name: Record build image ID
        run: docker image inspect awx-ee-dev:ci --format '{{.Id}}'

      - name: Check Python runtime and Receptor Go provenance
        run: |
          mkdir -p security-evidence
          docker run --rm --entrypoint /bin/sh awx-ee-dev:ci -c '
            set -eu
            /usr/bin/python3.12 -m pip check
            /usr/bin/python3.12 -c "import importlib.metadata as m; assert m.version(\"cryptography\")==\"50.0.0\""
            /usr/bin/python3.12 -c "import importlib.metadata as m; print(\"azure-cli\",m.version(\"azure-cli\"),\"msal\",m.version(\"msal\"),\"pyOpenSSL\",m.version(\"pyOpenSSL\"))"
            /usr/bin/python3.12 -c "import importlib.metadata as m; assert m.version(\"msgpack\")==\"1.2.1\""
            /usr/bin/python3.12 -c "import importlib.metadata as m; assert m.version(\"urllib3\")==\"2.8.0\""
            /usr/bin/python3.12 -c "import importlib.metadata as m; assert tuple(map(int,m.version(\"setuptools\").split(\".\")[:3])) >= (78,1,1)"
            test -x /usr/bin/receptor
          '
          cid=$(docker create --entrypoint /bin/sh awx-ee-dev:ci)
          docker cp "$cid:/usr/bin/receptor" security-evidence/receptor
          docker rm "$cid"
          go version -m security-evidence/receptor | tee security-evidence/receptor-go-build-info.txt
          test -s security-evidence/receptor-go-build-info.txt
      - name: Diagnose duplicate Python package installations
        run: |
          docker run --rm --entrypoint /bin/sh awx-ee-dev:ci -c '
            set -eu
            /usr/bin/python3.12 -c "import sys,importlib.metadata as m; print(sys.path); names=(\"cryptography\",\"msgpack\",\"setuptools\",\"urllib3\"); print([(n,d.version,str(d.locate_file(\"\"))) for n in names for d in m.distributions() if d.metadata.get(\"Name\",\"\").lower().replace(\"_\",\"-\")==n])"
            find /usr /opt -type d \( -iname "cryptography-*.dist-info" -o -iname "msgpack-*.dist-info" -o -iname "setuptools-*.dist-info" -o -iname "urllib3-*.dist-info" \) -print 2>/dev/null
          '
      - name: Smoke-test execution environment commands
        run: |
          docker run --rm --entrypoint /bin/sh awx-ee-dev:ci -c '
            set -eu
            export HOME=/tmp
            export ANSIBLE_LOCAL_TEMP=/tmp/ansible-local
            mkdir -p "$ANSIBLE_LOCAL_TEMP"
            ansible --version
            ansible-runner --version
            az version
            /usr/bin/receptor --version
            /usr/bin/python3.12 -m pip check
          '
      - name: Attribute inherited SBOM layer
        run: |
          mkdir -p security-evidence
          docker image inspect awx-ee-dev:ci --format '{{json .RootFS.Layers}}' > security-evidence/image-layers.json
          docker history --no-trunc awx-ee-dev:ci > security-evidence/image-history.txt
          docker image inspect awx-ee-dev:ci --format '{{json .Config.Labels}}' > security-evidence/image-labels.json
          docker run --rm --entrypoint /bin/sh awx-ee-dev:ci -c '
            find / -type f \( -iname "*sbom*.json" -o -iname "*sbom*.spdx" -o -iname "*cyclonedx*" \) -print 2>/dev/null || true
          ' > security-evidence/sbom-files.txt
          cat security-evidence/image-layers.json
          cat security-evidence/image-labels.json
      - name: Analyze generated Builder Dockerfile and inherited SBOM metadata
        run: |
          mkdir -p security-evidence
          cp context/Dockerfile security-evidence/ansible-builder-Dockerfile
          grep -nE 'FROM|COPY|RUN|pip|sbom|introspect' context/Dockerfile > security-evidence/builder-stages.txt || true
          docker history --no-trunc --format '{{.ID}}|{{.CreatedBy}}' awx-ee-dev:ci > security-evidence/image-history-raw.txt
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('security-evidence/ansible-builder-Dockerfile')
          print('Generated Dockerfile:',p.exists(),'bytes:',p.stat().st_size if p.exists() else 0)
          PY
      - name: Inspect embedded package SBOM provenance
        run: |
          mkdir -p security-evidence
          docker run --rm --entrypoint /bin/sh awx-ee-dev:ci -c '
            /usr/bin/python3.12 - <<"PY"
          import json
          from pathlib import Path
          roots = [Path("/usr/local/lib64/python3.12/site-packages"), Path("/usr/local/lib/python3.12/site-packages")]
          for root in roots:
              for path in sorted(root.glob("*.dist-info/sboms/*.json")):
                  try:
                      raw=path.read_text()
                      refs={name: (f"pkg:pypi/{name}@" in raw or f"\"name\": \"{name}\"" in raw) for name in ("msgpack","setuptools","urllib3")}
                      print(json.dumps({"sbom":str(path),"bytes":len(raw),"matches":refs}))
                      for name in refs:
                          import re
                          matches=sorted(set(re.findall(r"pkg:pypi/"+name+r"@[^\\\" ,}]+",raw)))
                          print(json.dumps({"sbom":str(path),"package":name,"purls":matches[:15]}))
                  except Exception as exc:
                      print(str(path),str(exc))
          PY
          ' | tee security-evidence/embedded-sbom-provenance.txt
      - name: Scan built image with Trivy (read-only, no publishing)
        run: |
          mkdir -p trivy-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-reports:/reports" \
            aquasec/trivy:0.75.0 image \
            --image-src docker \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /reports/awx-ee-trivy.json \
            awx-ee-dev:ci
      - name: Trace each Trivy finding to SBOM package source
        if: always()
        run: |
          mkdir -p security-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("trivy-reports/awx-ee-trivy.json")
          if not p.exists():
              raise SystemExit("Trivy JSON unavailable")
          data=json.loads(p.read_text())
          records=[]
          for result in data.get("Results",[]):
              packages=result.get("Packages") or []
              for vuln in result.get("Vulnerabilities") or []:
                  pkgid=vuln.get("PkgID","")
                  name=vuln.get("PkgName","")
                  ver=vuln.get("InstalledVersion","")
                  matches=[{
                    "ID":q.get("ID"),"Name":q.get("Name"),"Version":q.get("Version"),
                    "FilePath":q.get("FilePath"),"AnalyzedBy":q.get("AnalyzedBy"),
                    "Layer":q.get("Layer"),"Identifier":q.get("Identifier")
                  } for q in packages if q.get("ID")==pkgid or (q.get("Name")==name and q.get("Version")==ver)]
                  records.append({"target":result.get("Target"),"class":result.get("Class"),
                    "type":result.get("Type"),"id":vuln.get("VulnerabilityID"),
                    "package":name,"version":ver,"pkg_id":pkgid,
                    "vuln_layer":vuln.get("Layer"),"matches":matches[:8]})
          out=Path("security-evidence/trivy-sbom-attribution.json")
          out.write_text(json.dumps(records,indent=2))
          for x in records: print(json.dumps(x))
          PY
      - name: Summarize findings
        if: always()
        run: |
          if [ -f trivy-reports/awx-ee-trivy.json ]; then
            python3 - <<'PY'
          import json, os
          with open('trivy-reports/awx-ee-trivy.json') as f:
              data=json.load(f)
          counts={'CRITICAL':0,'HIGH':0}
          for result in data.get('Results',[]):
              for vuln in result.get('Vulnerabilities') or []:
                  severity=vuln.get('Severity')
                  if severity in counts: counts[severity]+=1
          line=f"Trivy awx-ee: CRITICAL={counts['CRITICAL']}, HIGH={counts['HIGH']}"
          print(line)
          if counts['CRITICAL'] > 0 or counts['HIGH'] > 4:
              raise SystemExit('EE vulnerability baseline regressed (limit: 0 critical, 4 high)')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(line+'\\n')
          PY
          fi
      - name: Save vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awx-ee-trivy-report
          path: |
            trivy-reports/awx-ee-trivy.json
            security-evidence/receptor-go-build-info.txt
            security-evidence/image-layers.json
            security-evidence/image-history.txt
            security-evidence/image-labels.json
            security-evidence/sbom-files.txt
            security-evidence/ansible-builder-Dockerfile
            security-evidence/builder-stages.txt
            security-evidence/image-history-raw.txt
            security-evidence/embedded-sbom-provenance.txt
            security-evidence/trivy-sbom-attribution.json
          if-no-files-found: warn
          retention-days: 30
