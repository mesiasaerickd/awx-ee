---
version: 3
images:
  base_image:
    name: registry.access.redhat.com/ubi9/ubi:9.8
dependencies:
  python_interpreter:
    package_system: python3.12
    python_path: /usr/bin/python3.12
  ansible_core:
    package_pip: ansible-core<2.19
  ansible_runner:
    package_pip: ansible-runner
  galaxy: |
    ---
    collections:
      - name: awx.awx
      - name: azure.azcollection
        version: ">=2.1.0"
      - name: amazon.aws
      - name: theforeman.foreman
      - name: google.cloud
      - name: openstack.cloud
      - name: community.vmware
      - name: ovirt.ovirt
      - name: kubernetes.core
      - name: ansible.posix
      - name: ansible.windows
      - name: redhatinsights.insights
      - name: kubevirt.core
  system: |
    git-core [platform:rpm]
    python3.12-devel [platform:rpm compile]
    libcurl-devel [platform:rpm compile]
    krb5-devel [platform:rpm compile]
    krb5-workstation [platform:rpm]
    subversion [platform:rpm]
    subversion [platform:dpkg]
    git-lfs [platform:rpm]
    sshpass [platform:rpm]
    rsync [platform:rpm]
    epel-release [platform:rpm]
    unzip [platform:rpm]
    podman-remote [platform:rpm]
    cmake [platform:rpm compile]
    gcc [platform:rpm compile]
    gcc-c++ [platform:rpm compile]
    make [platform:rpm compile]
    openssl-devel [platform:rpm compile]
  python: |
    git+https://github.com/ansible/awx.git@devel#subdirectory=awxkit
    git+https://github.com/ansible/ansible-sign
    ncclient
    paramiko
    pykerberos
    pyOpenSSL
    pypsrp[kerberos,credssp]
    pywinrm[kerberos,credssp]
    toml
    pexpect>=4.5
    python-daemon
    pyyaml
    six
    receptorctl
    # Resolve security-patched versions before ansible-builder assembles the final image.
    msgpack==1.2.1
    setuptools>=78.1.1
    urllib3==2.8.0
additional_build_steps:
  append_base:
    - RUN $PYCMD -m pip install -U pip
    - RUN $PYCMD -m pip install --upgrade --no-cache-dir 'msgpack==1.2.1' 'setuptools>=78.1.1' 'urllib3==2.8.0' && $PYCMD -m pip check
  append_final:
    - COPY --from=awx-ee-receptor-patched:ci /out/receptor /usr/bin/receptor
    - RUN /usr/bin/python3.12 -m pip install --upgrade --no-cache-dir 'azure-cli>=2.75.0' 'pyOpenSSL>=26.4.0' 'cryptography==50.0.0' 'msgpack==1.2.1' 'setuptools>=78.1.1' 'urllib3==2.8.0' && /usr/bin/python3.12 -m pip check
    - RUN mkdir -p /var/run/receptor
    - RUN git lfs install --system
    # SymLink `python` -> `python3.12`
    - RUN alternatives --install /usr/bin/python python /usr/bin/python3.12 312
